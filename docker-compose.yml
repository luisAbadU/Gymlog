services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-gymlog}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Define POSTGRES_PASSWORD en .env}
      POSTGRES_DB: ${POSTGRES_DB:-gymlog}
    volumes:
      - pgdata:/var/lib/postgresql/data
      # Crea también la base gymlog_test la primera vez que arranca el volumen.
      - ./docker/initdb:/docker-entrypoint-initdb.d:ro
    ports:
      # Solo en el propio equipo: las pruebas locales se conectan aquí.
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    image: ${GYMLOG_IMAGE:-gymlog:dev}
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-gymlog}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-gymlog}
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "127.0.0.1:8000:8000"

volumes:
  pgdata:
