[project]
name = "gymlog"
version = "0.1.0"
description = "App web personal para registrar entrenamientos del gimnasio."
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = [
    "alembic>=1.20",
    "fastapi>=0.162",
    "jinja2>=3.1",
    "psycopg[binary]>=3.3",
    "pydantic-settings>=2.16",
    "sqlalchemy>=2.1",
    "uvicorn[standard]>=0.54",
]

[dependency-groups]
dev = [
    "httpx2>=2.16",
    "pytest>=9.2",
    "ruff>=0.17",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
